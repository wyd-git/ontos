name: Foundation CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  push:
    branches:
      - main
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && 'Foundation Preflight' || 'Foundation Gate' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install frozen Node.js toolchain
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Run the local/CI-identical gate
        env:
          ONTOS_CI_EVENT_NAME: ${{ github.event_name }}
          ONTOS_CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          ONTOS_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ONTOS_CI_PR_DRAFT: ${{ github.event.pull_request.draft || false }}
        run: npm run verify

      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foundation-gate-${{ github.run_id }}
          path: generated/ci-report
          if-no-files-found: error
          retention-days: 14
